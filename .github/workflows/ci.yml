name: Offline security compatibility
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  compatibility:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: "24.22.1"
          cache: npm
      - run: npm ci --ignore-scripts
      - run: node --check index.js
      - run: npm test
      - run: npm audit --omit=dev
